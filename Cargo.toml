[package]
name = "fedexe-api-delivery"
version = "1.0.0-rc.2"
edition = "2024"
license = "MIT"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["macros", "sync", "fs", "io-util"] }
tempfile = "3.27.0"
regex = "1.13.1"
tokio-util = { version = "0.7.20", features = ["io"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-dialog = "2.8.4"
window-vibrancy = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

