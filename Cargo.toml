[package]
name = "fedexe-api-delivery"
version = "2.0.0"
edition = "2024"
license = "MIT"
default-run = "fedexe-api-delivery"

[[bin]]
name = "fedexe-runner"
path = "src/cli.rs"
required-features = ["cli"]

[features]
custom-protocol = ["tauri/custom-protocol"]
cli = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["macros", "sync", "fs", "io-util", "net", "time"] }
tempfile = "3.27.0"
regex = "1.13.1"
tokio-util = { version = "0.7.20", features = ["io"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2.14.1"
window-vibrancy = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

