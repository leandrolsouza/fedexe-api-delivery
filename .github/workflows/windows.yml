name: Windows updater release QA
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  updater:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.1
          path: previous
      - uses: actions/checkout@v4
        with:
          path: qa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the previous desktop with an isolated HTTPS updater
        working-directory: previous
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item ../qa/tools/qa-native.rs src/qa_native.rs
          $source = Get-Content src/main.rs -Raw
          $source = $source.Replace('fn main() {', "mod qa_native;`nfn main() {`n    if qa_native::read_fixture_secret() { return; }")
          $source = $source.Replace('if let Some(window) = app.get_webview_window("main") {', "if let Some(window) = app.get_webview_window(`"main`") {`n                    qa_native::bridge(window.clone());")
          $source = $source.Replace('tauri::generate_handler![', "tauri::generate_handler![`n            qa_native::result,")
          if ($source -notmatch 'qa_native::bridge' -or $source -notmatch 'qa_native::result') { throw 'QA bridge could not be attached' }
          Set-Content src/main.rs -Value $source -Encoding utf8
          $key = Join-Path $env:RUNNER_TEMP 'qa-updater.key'
          .\node_modules\.bin\tauri.cmd signer generate --ci -p disposable-ci-fixture -w $key *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = @{
            plugins = @{ updater = @{ pubkey = (Get-Content "$key.pub" -Raw).Trim(); endpoints = @('https://localhost:4231/latest.json') } }
          }
          $path = Join-Path $env:RUNNER_TEMP 'updater-qa.json'
          $config | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $path -Encoding utf8
          .\node_modules\.bin\tauri.cmd build --ci --config $path -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download the exact release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh run watch 44075862577 --exit-status --interval 15
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh run download 44075862577 --name fedexe-windows-nsis --dir candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise update, app restart, and data preservation
        timeout-minutes: 6
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'qa-updater.key'
          $installer = (Get-ChildItem 'candidate' -Filter '*-setup.exe').FullName
          $expected = ((Get-Content "$installer.sha256" -Raw) -split '\s+')[0]
          if ((Get-FileHash $installer).Hash -ne $expected) { throw 'Candidate checksum mismatch' }
          Move-Item -LiteralPath "$installer.sig" -Destination "$installer.production.sig"
          Write-Output 'Signing candidate with the disposable test key'
          & .\previous\node_modules\.bin\tauri.cmd signer sign --private-key-path $key --password disposable-ci-fixture --app-version 2.1.0 $installer *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Creating the loopback HTTPS certificate'
          $cert = New-SelfSignedCertificate -DnsName localhost -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.19={critical}{text}ca=true')
          $password = ConvertTo-SecureString 'disposable-ci-fixture' -AsPlainText -Force
          $pfx = Join-Path $env:RUNNER_TEMP 'qa-localhost.pfx'
          $public = Join-Path $env:RUNNER_TEMP 'qa-localhost.cer'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password -CryptoAlgorithmOption AES256_SHA256 | Out-Null
          Export-Certificate -Cert $cert -FilePath $public | Out-Null
          Import-Certificate -FilePath $public -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $previous = (Get-ChildItem 'previous/target/release/bundle/nsis' -Filter '*-setup.exe').FullName
          $dir = Join-Path $env:RUNNER_TEMP 'fedexe-updater-qa'
          Write-Output 'Installing the previous version'
          $setup = Start-Process -FilePath $previous -ArgumentList "/S /D=$dir" -WindowStyle Hidden -PassThru
          if (!$setup.WaitForExit(60000)) { $setup.Kill(); throw 'Previous setup did not finish in 60 seconds' }
          if ($setup.ExitCode -ne 0) { throw 'Previous setup failed' }
          $env:FEDEXE_UPDATER_QA_DIR = Join-Path $env:RUNNER_TEMP 'fedexe-qa-bridge'
          New-Item -ItemType Directory -Path $env:FEDEXE_UPDATER_QA_DIR | Out-Null
          $binary = Join-Path $dir 'fedexe-api-delivery.exe'
          $vaultReader = Join-Path $env:RUNNER_TEMP 'fedexe-qa-vault-reader.exe'
          Copy-Item -LiteralPath $binary -Destination $vaultReader
          Write-Output "Windows build $([Environment]::OSVersion.Version)"
          node qa/tools/qa-updater.mjs $binary $installer $pfx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $deadline = [DateTime]::UtcNow.AddSeconds(75)
          do {
            $version = (Get-Item -LiteralPath $binary -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
            $reopened = Get-Process -Name 'fedexe-api-delivery' -ErrorAction SilentlyContinue | Where-Object Path -EQ $binary
            if ($reopened -and $version -match '^2\.1\.0(?:\.0)?$') { break }
            Start-Sleep -Milliseconds 400
          } while ([DateTime]::UtcNow -lt $deadline)
          if (!$reopened -or $version -notmatch '^2\.1\.0(?:\.0)?$') { throw "Expected 2.1.0 to auto-relaunch, installed version: $version" }
          Start-Sleep -Seconds 2
          $expected = Get-Content (Join-Path $env:FEDEXE_UPDATER_QA_DIR 'expected-workspace.json') -Raw | ConvertFrom-Json
          $actual = Get-Content (Join-Path $env:APPDATA 'app.fedexe.api/workspace.json') -Raw | ConvertFrom-Json
          foreach ($kind in 'collections','environments') {
            $before = @($expected.$kind | ForEach-Object { "$($_.id) $($_.name)" })
            $after = @($actual.$kind | ForEach-Object { "$($_.id) $($_.name)" })
            if (Compare-Object $before $after) { throw "Workspace $kind changed after update" }
          }
          if (!($actual.collections.requests | Where-Object name -EQ 'Updater QA request')) { throw 'Saved request missing' }
          $environmentId = (Get-Content (Join-Path $env:FEDEXE_UPDATER_QA_DIR 'environment-id.txt') -Raw).Trim()
          $reader = Start-Process -FilePath $vaultReader -ArgumentList @('--qa-read-secret', $environmentId) -WindowStyle Hidden -Wait -PassThru
          if ($reader.ExitCode -ne 0) { throw 'Could not read the test credential' }
          $credential = Get-Content (Join-Path $env:FEDEXE_UPDATER_QA_DIR 'vault.json') -Raw | ConvertFrom-Json
          if ($credential -cne 'disposable-fixture') { throw 'Test credential was not preserved' }
          Write-Output 'Valid update relaunched 2.1.0 with collections, environments, saved request, and test credential intact.'
