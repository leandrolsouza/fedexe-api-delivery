name: Windows collection runner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - run: node tools/test-cli.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fedexe-cli-windows-x64
          if-no-files-found: error
          path: dist-cli/
